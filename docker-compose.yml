services:
  backend:
    build:
      context: .
      dockerfile: src/Back-End/Echo/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/echo.db
      - Cors__AllowedOrigins__0=http://localhost:3000
    volumes:
      - echo_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: src/Front-End
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  echo_data:
